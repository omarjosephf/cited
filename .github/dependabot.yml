version: 2

# This repository had no Dependabot configuration until 30 August 2026, which is
# how its workflow actions reached two majors behind without anyone noticing:
# `actions/checkout@v4` and `actions/setup-python@v5` were still on Node 20,
# which GitHub had already deprecated. The warning appeared in every CI run and
# was recorded as backlog rather than acted on, because nothing was watching.
#
# Pinning the actions fixed the symptom. This fixes the reason.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Actions are pinned to commit SHAs with the version in a trailing comment,
    # which is the supply-chain requirement: a tag can be moved to point at
    # different code, a SHA cannot. Dependabot updates both the SHA and the
    # comment together, so pinning does not mean going stale.

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive together rather than as separate pull
      # requests, matching the portfolio repository's convention.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Dependabot reads `pyproject.toml`. `requirements.lock` is not a filename
    # it recognises, so the lock is regenerated by the release process rather
    # than by Dependabot - a pull request here updates the declared range, and
    # the lock is refreshed when that change is prepared.
