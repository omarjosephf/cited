name: CI

# Runs on every push and pull request. The point is not the green tick — it is
# that the checks run somewhere other than the machine they were written on.
# "Works on mine" is the failure mode this exists to catch.

on:
  push:
    branches: [master, main]
  pull_request:

# Read-only by default. A workflow that only runs tests has no business being
# able to write to the repository, and the narrowest permission that works is
# the right one.
permissions:
  contents: read

concurrency:
  # A superseded run tells you nothing you will act on. Cancelling saves minutes
  # and keeps the visible status pointing at the current commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EMBEDDING_CACHE_DIR: .fastembed_cache

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          # Matches `requires-python = ">=3.12"`. Pinned rather than "latest"
          # so a new Python release cannot turn a passing build red overnight
          # for reasons unrelated to any change made here.
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: "requirements-*.lock"

      - name: Install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Dependency vulnerability gate
        run: python -m pip_audit --no-deps --disable-pip -r requirements-dev.lock -r requirements-build.lock

      - name: Prepare verified embedding model
        run: python scripts/prepare_model.py --cache-dir .fastembed_cache

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy src tests

      - name: Retrieval evaluation
        # The half of the evaluation that costs nothing. Retrieval is the layer
        # that fails first and silently, so it is worth checking on every commit
        # rather than only when someone remembers to run it locally.
        run: HF_HUB_OFFLINE=1 doc-assistant eval --suite demo --output eval/results/demo-retrieval.json

      - name: Read pinned portfolio revision
        id: portfolio
        run: echo "sha=$(python -c 'import json; print(json.load(open("eval/portfolio-source.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Checkout approved portfolio corpus
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          repository: omarjosephf/ojflorendo-portfolio
          ref: ${{ steps.portfolio.outputs.sha }}
          path: .ci/portfolio
          persist-credentials: false

      - name: Set up Node.js for the corpus exporter
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Stage verified portfolio corpus for tests and container
        run: node .ci/portfolio/scripts/export-assistant-corpus.mjs deploy/oj-assistant

      - name: Tests
        # No ANTHROPIC_API_KEY is set, deliberately. Every test must pass
        # without one: the suite uses a test double for the Anthropic client,
        # so a test that needs a live key is a test that cannot run here — and
        # a suite that only runs on one laptop is not a suite.
        run: pytest -q

      - name: Portfolio retrieval gate
        run: HF_HUB_OFFLINE=1 doc-assistant --corpus deploy/oj-assistant/content eval --suite portfolio --questions .ci/portfolio/content/assistant-eval/questions.toml --output eval/results/portfolio-retrieval.json

      - name: Build default container without provider credentials
        run: docker build --build-arg BACKEND_COMMIT="$GITHUB_SHA" --tag cited:ci .

  # Deliberately a separate job. A secret reaching a tracked file is not a test
  # failure like any other — it is the one failure that cannot be undone by
  # fixing the next commit, because the credential must then be treated as
  # compromised whether or not anyone read it. Isolating it means the reason a
  # build went red is unambiguous.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          # The guard scans tracked files at this commit. Full history would be
          # a different and much slower check; this catches the mistake at the
          # point it is still cheap to fix.
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: "requirements-*.lock"

      - name: Install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: No credentials in tracked files
        run: pytest tests/test_no_secrets_committed.py -q
