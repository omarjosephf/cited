# E.V release candidate on the existing Fly app; not an activation receipt.
# After owner approval and the durable-budget cutover checks:
#   fly deploy --config fly.oj-assistant.toml --remote-only --ha=false
# Always name this config: fly.toml targets the separate Cited demo.
#
# Requires an approved, preinitialized persistent volume, conservative current
# accounting, BUDGET_LEDGER_ID and the exact BUDGET_MACHINE_ID set privately.
# Startup refuses missing storage/identity; it never creates a new allowance.
# See docs/runbooks/durable-budget.md. Do not deploy this incomplete configuration
# to discover the missing prerequisites or use release_command to initialize it.

app = "oj-assistant"
primary_region = "lhr"

[build]

[deploy]
  # One machine with one ledger. A rolling update entails planned downtime;
  # canary/bluegreen cannot use its volume. Recheck the pinned ID after updates.
  strategy = "rolling"
  max_unavailable = 1

[env]
  PORT = "8080"
  CORPUS_DIR = "/app/deploy/oj-assistant/content"
  CORPUS_CHECKSUM_FILE = "/app/deploy/oj-assistant/CHECKSUM"
  CORPUS_VECTORS_FILE = "/opt/vectors/oj-assistant.npz"
  SYSTEM_PROMPT_FILE = "/app/deploy/oj-assistant/system-prompt.md"
  REQUIRE_SHARED_SECRET = "true"
  RETRIEVAL_TOP_K = "4"
  ANSWER_MAX_TOKENS = "1024"
  ANSWER_WORKERS = "1"
  BUDGET_PATH = "/data/budget.sqlite3"
  DAILY_ANSWER_LIMIT = "40"
  MONTHLY_ANSWER_LIMIT = "200"
  DAILY_BUDGET_MICRO_USD = "400000"
  MONTHLY_BUDGET_MICRO_USD = "2000000"
  # Reserve $0.04 per attempt: money limits admit at most 10/day and 50/month.
  # Complete provider credentials, account assertions and fallback activation
  # are private operator configuration after qualification, never values here.

[[mounts]]
  source = "ev_budget"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 5
  scheduled_snapshots = true
  # No automatic extension, independent replica or allowance-reset bootstrap.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Preserve the current latency choice. Persistent accounting survives restarts;
  # keeping warm is a latency decision, not a substitute for durable caps.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"

[[vm]]
  size = "shared-cpu-1x"
  # Preserve the existing tier: historical measured process peak ~974 MB.
  # Do not resize based on the smaller, separate Cited demo's measurements.
  memory = "1536mb"
  cpus = 1
