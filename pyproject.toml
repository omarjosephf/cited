[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-assistant"
version = "0.1.0"
description = "A document assistant that answers only from your documents, cites the exact source, and refuses when it cannot."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "OJ Florendo" }]
# 3.12 rather than 3.11: numpy's bundled type stubs use `type` statement syntax
# that only parses on 3.12+, so mypy cannot check this project against 3.11.
# Claiming support for a version the type checker can't verify would be a
# guess, and the deployment target is ours to choose anyway.
requires-python = ">=3.12"

# Pinned to major versions rather than exact ones: this is an application, but a
# public one that reviewers may install months from now, so it should still
# resolve. The lockfile is the reproducibility mechanism, not these ranges.
dependencies = [
    "fastembed>=0.8,<0.9",     # ONNX embeddings — deliberately NOT torch (ADR-0001)
    "pypdf>=6.0,<7",
    "python-docx>=1.1,<2",
    "anthropic>=0.75",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
# Split out so the ingestion/retrieval core can be installed and tested without
# pulling a web server — the same boundary that keeps a future client
# deployment a wrapper rather than a rewrite.
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "slowapi>=0.1.9,<1"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "pyyaml>=6.0"]

# No console script yet. One was declared here before the module existed, which
# meant `pip install -e .` produced a `doc-assistant` command that died with
# ModuleNotFoundError. A broken entry point is worse than a missing one: the
# missing one is obvious, the broken one looks like the project does not work.
# Restore this line in the same commit that adds `assistant/cli.py`.

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# fastembed ships no type stubs; everything we write stays strictly typed.
[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true
