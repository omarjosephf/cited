# Pinned dependency set — for reproducible deployment, not for CI.
#
# Generated with `pip freeze` from a known-good environment. Every version here
# is one this project has actually been run and tested against.
#
# WHAT THIS GUARANTEES
#   The same versions install every time. That is what makes a deployment
#   reproducible: a container built today and rebuilt in six months resolves to
#   the same packages rather than to whatever has since been released.
#
# WHAT IT DOES NOT GUARANTEE
#   Integrity. These are version pins, not hashes, so they do not prove a
#   package on the index is the same artefact that was tested. Hash pinning
#   needs `pip-compile --generate-hashes`; it is worth adding before this
#   handles anything of consequence, and is not worth pretending is already
#   here.
#
# WHY CI DOES NOT USE THIS FILE
#   Deliberate. CI installs from the ranges in pyproject.toml, so it resolves
#   the newest compatible versions on every run. That is a different and more
#   useful signal: it catches an upstream release breaking this project within
#   a day, rather than the first time someone regenerates the lock. Pinning CI
#   would trade an early warning for a quieter build.
#
#   Use this file where reproducibility matters more than early warning:
#       pip install -r requirements.lock
#
# REGENERATING
#   pip install -e ".[api,dev]" && pip freeze --exclude-editable > requirements.lock
#   Then re-add the sys_platform marker below — pip freeze does not emit
#   environment markers, so a Windows-only package would otherwise make this
#   file uninstallable on Linux.
