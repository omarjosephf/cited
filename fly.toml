# Fly.io configuration.
#
# The app name is set by `fly launch` and must be globally unique; change it
# there rather than guessing one here.
#
# DEPLOY WITH:
#     fly deploy --remote-only --ha=false
#
# `--ha=false` is not optional here, and there is no fly.toml setting for it.
# Without it Fly helpfully creates a *second* machine for high availability,
# which it did on the first deploy of this app.
#
# For a stateless web service that would be a good default. This service is not
# stateless: the daily answer budget is a counter in the process's own memory
# (see assistant/budget.py). A second machine runs a second process with a
# second counter, so a limit of 200 answers a day silently permits 400 — and
# doubles the monthly bill for a demo that needs one machine.
#
# `--remote-only` builds on Fly's builder, which is what makes a deploy possible
# from a machine with no Docker installed.

app = "cited-demo"
primary_region = "lhr"          # London: nearest to the author and to UK readers

[build]

[env]
  PORT = "8080"
  # ANTHROPIC_API_KEY is NOT set here. This file is committed, so anything in it
  # is public. The key is set with `fly secrets set`, which stores it encrypted
  # and injects it at runtime without it ever entering the repository or an
  # image layer.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true

  # Kept warm rather than scaled to zero — but not for the reason first assumed.
  #
  # Startup was expected to be slow. Measured, it is not: 1.8s from a cold
  # process to a built index (0.1s imports, 1.4s ONNX session, 0.3s embedding
  # the corpus), with the model already baked into the image. Machine boot on
  # top of that still leaves a few seconds, which a portfolio demo could afford.
  #
  # The real reason is the daily budget. It is a counter in process memory, so
  # it only bounds spend across a process lifetime — a machine that stops and
  # starts begins again at zero, and the cap it appears to enforce is not the
  # cap that applies. Staying up is what makes that protection true.
  #
  # Setting this to 0 is therefore a deliberate trade, not a saving: it cuts the
  # bill to near nothing and leaves the provider-side spend cap as the only real
  # ceiling. That cap must exist either way; here it would be load-bearing.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # Well below what the process could serve. The bottleneck is not the web
    # layer, it is the paid API call behind it, and queueing requests is
    # preferable to running several expensive calls at once.
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  # /health reports the corpus size and the remaining daily budget without
  # touching the paid path, so checking it frequently costs nothing.
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"          # room for the model to load on a cold start
  method = "GET"

[[vm]]
  size = "shared-cpu-1x"
  # Measured, not guessed. Peak resident memory with the model loaded, the
  # corpus indexed and 25 queries served is 263 MB; the web server and the
  # Anthropic client add tens of MB and load no model, so the working figure is
  # roughly 300 MB. This was set to 1 GB on the reasoning that 512 MB "is not
  # enough", which was wrong and cost about three times the price of the tier
  # that fits.
  #
  # 512 MB leaves ~40% headroom. That is comfortable but not unlimited: a much
  # larger corpus grows the index, and the failure mode is the container being
  # killed mid-request rather than any error that explains itself. Re-measure
  # before adding documents in bulk.
  memory = "512mb"
  cpus = 1
